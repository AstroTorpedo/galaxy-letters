name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'artifacts/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  import-web-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      # One-time import preserves directories when first publishing through GitHub's web UI.
      # Later runs skip this step because the temporary parts have been removed.
      - name: Restore verified source uploaded through the web
        if: hashFiles('source-upload.part-*') != ''
        env:
          SOURCE_ARCHIVE_SHA256: c175ad6f6b17c13043b0b20597d71054cce284262cde98a83e03e4afc8158904
        run: |
          cat source-upload.part-* > "$RUNNER_TEMP/game-source.tar.gz"
          printf '%s  %s\n' "$SOURCE_ARCHIVE_SHA256" "$RUNNER_TEMP/game-source.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/game-source.tar.gz" --no-same-owner
          rm source-upload.part-*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          git commit -m 'Import full game source and simulated cubes from web upload'
          git push origin HEAD:main

  build:
    needs: import-web-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build web game
        run: npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
